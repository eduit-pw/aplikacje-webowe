<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>AGV Fleet Battery Monitor</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f8f9fa; }
        .kontener-baterii { width: 100%; max-width: 600px; height: 45px; background: #e9ecef; border-radius: 25px; overflow: hidden; border: 2px solid #ced4da; margin: 20px 0; position: relative; }
        .pasek-energii { width: 100%; height: 100%; background: #28a745; text-align: center; line-height: 45px; color: #fff; font-weight: bold; font-size: 18px; border-radius: 25px; }
        .alarm-rozladowania { background: #dc3545 !important; }
        .stan-sredni { background: #ffc107 !important; color: #000 !important; }
        .panel-sterowania { display: flex; gap: 10px; align-items: center; }
        input[type="number"] { padding: 10px; width: 120px; font-size: 16px; border-radius: 4px; border: 1px solid #ced4da; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-update { background: #007bff; color: white; }
        .btn-stop { background: #6c757d; color: white; }
    </style>
</head>
<body>

    <h2>Monitor Akumulatora Robota AGV #14</h2>

    <div class="kontener-baterii">
        <div class="pasek-energii" id="pasekEnergii">100%</div>
    </div>

    <div class="panel-sterowania">
        <label>Zadaj poziom (%):</label>
        <input type="number" id="poziomZadany" min="0" max="100" value="45">
        <button type="button" class="btn-update" id="btnZastosuj">Zastosuj Poziom</button>
        <button type="button" class="btn-stop" id="btnAwaryjnyStop">Zatrzymaj Ruch (Stop)</button>
    </div>
    <p id="komunikatBledu" style="color: red; display: none;">Podaj poprawną wartość w przedziale 0 - 100%!</p>

    <script>
        $(document).ready(function() {
            // KROK 1: Obsłuż kliknięcie #btnZastosuj
            // KROK 2: Walidacja zakresu 0 - 100
            // KROK 3: Animacja szerokości .animate({ width: 'X%' })
            // KROK 4: Aktualizacja barwy paska (zielony, żółty, czerwony)
            // KROK 5: Obsługa zatrzymania animacji metodą .stop() na #btnAwaryjnyStop
        });
    </script>
</body>
</html>
