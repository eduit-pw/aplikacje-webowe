<!doctype html><html lang="pl"><meta charset="utf-8"><title>Próba CORS</title>
<button id="odczyt">Odczytaj</button><button id="dodaj">Dodaj testowy produkt</button><pre id="wynik"></pre>
<script>
async function wykonaj(opcje) {
 try {const r=await fetch('http://localhost:3094/produkty',opcje);
 const dane=await r.json();if(!r.ok)throw new Error(dane.blad??'Błąd HTTP');
 document.querySelector('#wynik').textContent=JSON.stringify(dane,null,2);
 }catch(e){document.querySelector('#wynik').textContent=e.message;}
}
document.querySelector('#odczyt').addEventListener('click',()=>wykonaj());
document.querySelector('#dodaj').addEventListener('click',()=>wykonaj({method:'POST',
 headers:{'Content-Type':'application/json'},body:JSON.stringify({nazwa:'Teczka'})}));
</script></html>
